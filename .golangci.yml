version: "2"

linters:
  default: standard
  enable:
    # Core correctness checks commonly enabled by mature Go projects.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional maintained checks for API usage, security, and readability.
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  exclusions:
    rules:
      # The analyzer intentionally reads caller-selected files and invokes
      # configured analysis tools; these are not untrusted application inputs.
      - linters:
          - gosec
        text: "G204|G304"
      - path: _test\.go
        linters:
          - gosec
