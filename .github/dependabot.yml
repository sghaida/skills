
version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
